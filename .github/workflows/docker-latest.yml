name: Docker Latest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish as latest'
        required: true
        type: string

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Validate tag
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [[ ! "$TAG" =~ ^v.+$ ]]; then
          echo "Tag must begin with v."
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build app
      run: pnpm run build

    - name: Login to Alibaba Cloud
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: BlazeSnow23
        password: ${{ secrets.AlibabaTOKEN }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: composebuilder
        password: ${{ secrets.TOKEN }}

    - name: Login to GitHub
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          registry.cn-hangzhou.aliyuncs.com/blazesnow/composebuilder:latest
          composebuilder/composebuilder:latest
          ghcr.io/composebuilder/composebuilder:latest
