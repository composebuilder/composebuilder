<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>页面未找到 - ComposeBuilder</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f0e8;
      --surface: #fff9f2;
      --surface-2: #fff4e4;
      --ink: #1d1b19;
      --muted: #6b5f52;
      --accent: #c45a1a;
      --accent-2: #247c8a;
      --accent-3: #e2b13c;
      --ring: rgba(196, 90, 26, 0.25);
      --shadow: 0 18px 50px rgba(29, 27, 25, 0.12);
      --body-grad-1: #fff3df;
      --body-grad-2: #eadfce;
      --font-title: "Fraunces", "Times New Roman", serif;
      --font-body: "Space Grotesk", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at top left, var(--body-grad-1) 0%, var(--bg) 45%, var(--body-grad-2) 100%);
      color: var(--ink);
      font-family: var(--font-body);
    }

    .app {
      display: grid;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
      place-items: center;
    }

    .hero {
      position: relative;
      display: grid;
      width: 100%;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      overflow: hidden;
      padding: 28px;
      background: linear-gradient(120deg, var(--surface) 10%, var(--surface-2) 90%);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero__content {
      position: relative;
      z-index: 1;
    }

    .hero__eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-family: var(--font-title);
      font-size: clamp(2rem, 3vw, 3rem);
    }

    .hero__subtitle {
      max-width: 32rem;
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .button--primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 10px 20px rgba(196, 90, 26, 0.25);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button--primary:hover,
    .button--primary:focus-visible {
      background: #a94713;
      box-shadow: 0 12px 24px rgba(196, 90, 26, 0.32);
    }

    .button:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }

    .hero__art {
      position: relative;
      min-height: 200px;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(0.5px);
      animation: float 12s ease-in-out infinite;
    }

    .orb--one {
      top: 10px;
      right: 40px;
      width: 150px;
      height: 150px;
      background: rgba(196, 90, 26, 0.18);
    }

    .orb--two {
      right: 10px;
      bottom: -40px;
      width: 210px;
      height: 210px;
      background: rgba(36, 124, 138, 0.2);
      animation-delay: -4s;
    }

    .orb--three {
      top: 90px;
      right: 190px;
      width: 120px;
      height: 120px;
      background: rgba(226, 177, 60, 0.22);
      animation-delay: -8s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 24px;
      }

      .hero {
        padding: 22px;
      }

      .hero__art {
        min-height: 140px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --surface: #1f1d1b;
        --surface-2: #23211f;
        --ink: #f4efe8;
        --muted: #b6a99a;
        --accent: #e07a3a;
        --accent-2: #37a0b0;
        --accent-3: #f0c35a;
        --ring: rgba(224, 122, 58, 0.35);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        --body-grad-1: #1b1917;
        --body-grad-2: #0e0d0c;
      }

      .button--primary:hover,
      .button--primary:focus-visible {
        background: #bf5f24;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="hero">
      <div class="hero__content">
        <p class="hero__eyebrow">ComposeBuilder · 404</p>
        <h1>页面未找到</h1>
        <p class="hero__subtitle">请求的页面不存在，或已被移动。</p>
        <a class="button button--primary" href="/">返回 ComposeBuilder 首页</a>
      </div>
      <div class="hero__art" aria-hidden="true">
        <div class="orb orb--one"></div>
        <div class="orb orb--two"></div>
        <div class="orb orb--three"></div>
      </div>
    </main>
  </div>
</body>

</html>
