<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>页面未找到 - ComposeBuilder</title>
  <style>
    :root {
      color: #17212b;
      background: #f6f7f8;
      font-family: "Space Grotesk", "Noto Sans SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 560px);
      border-top: 4px solid #e4573d;
      padding: 36px 0;
    }

    p {
      margin: 0;
    }

    .code {
      color: #e4573d;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 12px 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.2;
    }

    .description {
      color: #53606c;
      font-size: 16px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 16px;
      border: 1px solid #17212b;
      color: #17212b;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: #ffffff;
      background: #17212b;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>页面未找到</h1>
    <p class="description">请求的页面不存在，或已被移动。</p>
    <a href="/">返回 ComposeBuilder 首页</a>
  </main>
</body>

</html>
